volumes:
  opendb_local_postgres_data: {}
  opendb_local_postgres_data_backups: {}


services:
  django:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: opendb_local_django
    container_name: opendb_local_django
    depends_on:
      - postgres
      - mailpit
    volumes:
      - /app/.venv
      - .:/app:z
    env_file:
      - path: ./.envs/.local/.django
        required: false
      - path: ./.envs/.local/.postgres
        required: false
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: opendb_production_postgres
    container_name: opendb_local_postgres
    volumes:
      - opendb_local_postgres_data:/var/lib/postgresql/data
      - opendb_local_postgres_data_backups:/backups
    env_file:
      - path: ./.envs/.local/.postgres
        required: false

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: opendb_local_mailpit
    ports:
      - "8025:8025"

# Same-origin web + MCP behind a trusted HTTPS ingress.
# docker compose -f docker-compose.local.yml -f docker-compose.mvp.yml \
#   -f docker-compose.domain.yml --profile mcp up -d
services:
  django:
    ports: !reset []
  mcp:
    ports: !reset []
  gateway:
    image: nginx@sha256:35e3238f2f0925a505d5d697df9a9148db9a0c78e89fd2e253919047b3cec824
    ports:
      - '127.0.0.1:8000:8080'
    volumes:
      - ./compose/domain/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      django:
        condition: service_healthy
      mcp:
        condition: service_started
    restart: unless-stopped

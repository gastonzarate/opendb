# Same-origin web + MCP behind a trusted HTTPS ingress.
# docker compose -f docker-compose.local.yml -f docker-compose.mvp.yml \
#   -f docker-compose.domain.yml --profile mcp up -d
services:
  django:
    ports: !reset []
  mcp:
    ports: !reset []
  gateway:
    image: nginx@sha256:05b8cb60c354a44ab824ea6e7dc69b46d50762cdbe728a347a5b656e6fb3d7c4
    ports:
      - '127.0.0.1:8000:8080'
    volumes:
      - ./compose/domain/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      django:
        condition: service_healthy
      mcp:
        condition: service_started
    restart: unless-stopped

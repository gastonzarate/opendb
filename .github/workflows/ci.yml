name: CI

# Enable Buildkit and let compose use it to speed up image building
env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

on:
  pull_request:
    branches: ['main']
    paths-ignore: ['docs/**']

  push:
    branches: ['main']
    paths-ignore: ['docs/**']

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  pytest:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.integration
      COMPOSE_PROJECT_NAME: opendb-ci-test
      # The real-model smoke test requires an explicitly configured local server.
      OPENDB_REAL_EMBEDDINGS_URL: ''

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install pinned Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Start disposable test PostgreSQL
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Check Django configuration
        run: uv run --frozen python manage.py check

      - name: Check DB Migrations
        run: uv run --frozen python manage.py makemigrations --check --dry-run

      - name: Run DB Migrations
        run: uv run --frozen python manage.py migrate --noinput

      - name: Run Django Tests
        run: uv run --frozen pytest --ds=config.settings.integration -p no:cacheprovider

      - name: Tear down disposable test PostgreSQL
        if: ${{ always() }}
        run: docker compose -f docker-compose.test.yml down --volumes

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run format:check
      - run: npm test
      - run: npm run build

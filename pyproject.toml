[project]
name = "opendb"
version = "0.1.0"
description = "Private personal database with structured data and MCP access."
readme = "README.md"
authors = [
  { name = "Gaston Zarate", email = "gaston.z195@gmail.com" },
]
requires-python = "==3.14.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argon2-cffi==25.1.0",
  "crispy-bootstrap5==2026.9",
  "cryptography>=46",
  "django==6.1.1",
  "django-allauth[mfa,socialaccount]==65.19.3",
  "django-anymail==15.2",
  "django-crispy-forms==2.7",
  "django-environ==0.14.0",
  "django-model-utils==5.0.0",
  "django-redis==7.0.0",
  "fastmcp==3.4.7",
  "gunicorn==26.2.0",
  "hiredis==3.4.1",
  "pglast==8.4",
  "pillow==12.3.0",
  "psycopg[binary]==3.3.5",
  "py-key-value-aio[filetree,wrappers-encryption]==0.4.5",
  "python-slugify==8.0.4",
  "redis==8.1.0",
  "requests>=2.34.2",
  "uvicorn[standard]==0.52.4",
  "uvicorn-worker==0.4.0",
  "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
  "coverage==7.16.1",
  "django-coverage-plugin==3.2.2",
  "django-debug-toolbar==8.0.0",
  "django-extensions==4.1",
  "django-stubs[compatible-mypy]==6.1.0",
  "django-upgrade==1.32.0",
  "djlint==1.46.1",
  "factory-boy==3.3.3",
  "ipdb==0.13.13",
  "mypy==2.3.1",
  "pre-commit==4.6.2",
  "psycopg[binary]==3.3.5",
  "pytest==9.1.1",
  "pytest-django==4.14.0",
  "pytest-sugar==1.1.1",
  "ruff==0.16.7",
  "sphinx==9.1.0",
  "sphinx-autobuild==2025.8.25",
  "watchfiles==1.2.0",
  "werkzeug[watchdog]==3.1.8",
]

# ==== djLint ====
[tool.djlint]
profile = "django"
include = "H017,H035"
indent = 2
max_line_length = 119
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
custom_blocks = "element,slot"
ignore = "H006,H030,H031"
css.indent_size = 2
js.indent_size = 2

# ==== ruff ====
[tool.ruff]
# Exclude a variety of commonly ignored directories.
extend-exclude = [
  "*/migrations/*.py",
  "staticfiles/*",
]
lint.select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "COM812", # Formatter owns trailing commas.
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "SIM102", # sometimes it's better to nest
  # of types for comparison.
  # Deactivated because it can make the code slow:
  # https://github.com/astral-sh/ruff/issues/7871
]
lint.isort.force-single-line = true

[tool.ruff.lint.per-file-ignores]
"opendb/databases/sql_policy.py" = [ "C901", "PLR0912", "PLR0915" ]
"opendb/databases/services.py" = [ "C901", "PLC0415", "PLR0911", "PLR0912" ]
"opendb/databases/connections.py" = [ "PLC0415" ]
"opendb/databases/provisioning.py" = [ "PLC0415", "PLR0915", "TRY301" ]
"tests/**/*.py" = [ "PLC0415", "PLR2004" ]

# ==== pyproject-fmt ====
[tool.pyproject-fmt]
keep_full_version = true

# ==== mypy ====
[tool.mypy]
ignore_missing_imports = true
python_version = "3.14"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = [
  "mypy_django_plugin.main",
]
warn_unused_configs = true
overrides = [
  # Django migrations should not produce any errors:
  { module = "*.migrations.*", ignore_errors = true }
]

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== pytest ====
[tool.pytest]
addopts = [
  "--ds=config.settings.test",
  "--reuse-db",
  "--import-mode=importlib",
]
minversion = "9.0"
python_files = [
  "tests.py",
  "test_*.py",
]

[tool.coverage]
# ==== Coverage ====
run.include = [ "opendb/**" ]
run.omit = [ "*/migrations/*", "*/tests/*" ]
run.plugins = [ "django_coverage_plugin" ]

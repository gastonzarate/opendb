# Only Dokploy's trusted TLS ingress may reach this listener.
map $http_x_forwarded_proto $original_scheme {
    default http;
    https https;
}
map $uri $opendb_backend {
    default http://web:8000;
    ~^/mcp(/|$) http://mcp:8001;
    ~^/\.well-known(/|$) http://mcp:8001;
    ~^/(authorize|token|register|consent|auth/callback)(/|$) http://mcp:8001;
}
server {
    listen 8080;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 4m;
    # OAuth query strings contain authorization codes.
    access_log off;
    location / {
        proxy_pass $opendb_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $original_scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# TLS terminates at the trusted ingress (Tailscale Serve in this environment).
# This proxy binds only to host loopback; never trust these headers on public HTTP.
map $http_x_forwarded_proto $original_scheme {
    default $scheme;
    https https;
}
map $uri $opendb_backend {
    default http://django:8000;
    ~^/mcp(/|$) http://mcp:8001;
    ~^/\.well-known/ http://mcp:8001;
    ~^/(authorize|token|register|consent|auth/callback)(/|$) http://mcp:8001;
}
server {
    listen 8080;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 4m;
    # OAuth callback query strings may contain authorization codes.
    access_log off;
    location / {
        proxy_pass $opendb_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $original_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
